name: Publish vert addon image

# Builds and pushes the Vert add-on wrapper image (vert/Dockerfile, which
# pins the upstream ghcr.io/vert-sh/vert digest) as:
#   jonthekiller/vert-addon-amd64:<version>   (from linux/amd64)
#   jonthekiller/vert-addon-aarch64:<version> (from linux/arm64)
#
# Triggers:
#  - push to main touching vert/** (e.g. the update bot bumping VERT_DIGEST
#    and config.json version) — the tag comes from vert/config.json.
#  - workflow_dispatch (manual rebuild).
#
# Required secrets: DOCKERHUB_USERNAME / DOCKERHUB_TOKEN (Docker Hub account
# with write access to jonthekiller/vert-addon-*).

on:
  push:
    branches: [main]
    paths:
      - "vert/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-vert
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read add-on version
        id: version
        run: echo "version=$(node -p "require('./vert/config.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./vert
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            jonthekiller/vert-addon-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            jonthekiller/vert-addon-${{ matrix.arch }}:latest
          cache-from: type=gha,scope=vert-${{ matrix.arch }}
          cache-to: type=gha,scope=vert-${{ matrix.arch }},mode=max

      - name: Summary
        run: |
          echo "vert-addon-${{ matrix.arch }}:${{ steps.version.outputs.version }} published" >> "$GITHUB_STEP_SUMMARY"
